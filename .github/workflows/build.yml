name: Build K.OS images

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "windows/**"
  schedule:
    # Every day at 05:20 UTC (08:20 Istanbul), so K.OS picks up Bazzite updates
    - cron: "20 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: imdefnotk

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: kos-nvidia
            base_image: ghcr.io/ublue-os/bazzite-nvidia-open:stable
            session_mode: nvidia-desktop
          - target: kos-nvidia-deck
            base_image: ghcr.io/ublue-os/bazzite-deck-nvidia:stable
            session_mode: nvidia-deck
          # Product image: normal Bazzite base, same K.OS session as kos-nvidia
          - target: kos-amd
            base_image: ghcr.io/ublue-os/bazzite:stable
            session_mode: amd-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space on the build machine
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Work out the date tag
        run: echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "${GITHUB_ENV}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          pull: true
          push: true
          # Plain single image (no extra attestation entries) so rpm-ostree and bootc read it cleanly
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.target }}:stable
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.target }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.target }}:stable-${{ env.BUILD_DATE }}
          labels: |
            org.opencontainers.image.title=${{ matrix.target }}
            org.opencontainers.image.description=K.OS console operating system (${{ matrix.session_mode }})
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            containers.bootc=1
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            KOS_TARGET=${{ matrix.target }}
            KOS_SESSION_MODE=${{ matrix.session_mode }}
