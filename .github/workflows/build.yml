name: Build K.OS OCI Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: kos-nvidia
            base_image: ghcr.io/ublue-os/bazzite-nvidia-open:stable
            session_mode: nvidia-desktop
          - target: kos-amd
            base_image: ghcr.io/ublue-os/bazzite-deck:stable
            session_mode: amd-deck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/imdefnotk/${{ matrix.target }}:stable
            ${{ env.REGISTRY }}/imdefnotk/${{ matrix.target }}:latest
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            KOS_TARGET=${{ matrix.target }}
            KOS_SESSION_MODE=${{ matrix.session_mode }}