<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>K.OS Home</title>
<style>
  @font-face {
    font-family: "Space Grotesk";
    font-weight: 700;
    src: url("file:///usr/share/kos/home/fonts/space-grotesk-latin-700-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-weight: 500;
    src: url("file:///usr/share/kos/home/fonts/inter-latin-ext-500-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-weight: 500;
    src: url("file:///usr/share/kos/home/fonts/inter-latin-500-normal.woff2") format("woff2");
  }
  html, body { margin: 0; height: 100%; background: #0A0A0C; overflow: hidden; cursor: none; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .logo { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 18vh; letter-spacing: -0.05em; color: #F4F4F5; line-height: 1; }
  .dot { display: inline-block; width: 0.2em; height: 0.2em; margin-left: 0.11em; border-radius: 50%; background: #E5322D; vertical-align: baseline; box-shadow: 0 0 0.25em rgba(229, 50, 45, 0.7); animation: pulse 1.6s ease-in-out infinite; }
  .text { margin-top: 5vh; font-family: "Inter", sans-serif; font-weight: 500; font-size: 2.4vh; color: #A1A1AA; letter-spacing: 0.02em; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">K<span class="dot"></span></div>
    <div class="text" id="t">Hazırlanıyor...</div>
  </div>
<script>
  if ((navigator.language || '').toLowerCase().indexOf('en') === 0) {
    document.getElementById('t').textContent = 'Getting ready...';
  }
</script>
</body>
</html>
